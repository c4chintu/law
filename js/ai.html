<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Download Form</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            padding: 0;
            text-align: center;
        }

        /* Button */
        .btn {
            margin-top: 100px;
            padding: 12px 25px;
            background: #28a745;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
        }

        /* Form Container (Hidden Top) */
        .form-container {
            position: fixed;
            top: -300px;
            left: 50%;
            transform: translateX(-50%);
            width: 300px;
            background: white;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: 0.5s;
            border-radius: 10px;
        }

        /* Active class (Slide Down) */
        .form-container.active {
            top: 50px;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
        }

        .download-btn {
            background: blue;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Download Button -->
    <button class="btn" onclick="showForm()">Download</button>

    <!-- Form -->
    <div class="form-container" id="formBox">
        <h3>Download Form</h3>
        <input type="text" placeholder="Enter Name"><br>
        <input type="email" placeholder="Enter Email"><br>
        <button class="download-btn">Download File</button>
    </div>

    <script>
        function showForm() {
            document.getElementById("formBox").classList.toggle("active");
        }
    </script>

</body>
</html>
